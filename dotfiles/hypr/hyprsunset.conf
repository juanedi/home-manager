# Makes hyprsunset do nothing to the screen by default
# Without this, the default applies some tint to the monitor
profile {
    time = 07:00
    identity = true
}

# Auto-switching only works while the hyprsunset daemon runs; autostart.lua
# launches it at boot with o.launch_on_start("hyprsunset").
profile {
    time = 20:00
    temperature = 4000
}
